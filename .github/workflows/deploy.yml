name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # Major-tag i.p.v. v1.2.0 — GitHub's codeload had de specifieke
        # v1.2.0-SHA tijdelijk niet beschikbaar (run #143 faalde op
        # "Failed to download archive"). @v1 volgt de laatste minor/patch
        # binnen v1 en wordt door de maintainer onderhouden.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR=/var/www/bookingbay
            ENV_FILE=/etc/bookingbay/.env.production

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repo. Clone it first:"
              echo "  cd $APP_DIR && git clone https://github.com/DaanRVRS/bookingbay.git ."
              exit 1
            fi

            cd "$APP_DIR"

            echo "==> Pulling latest from origin/main"
            git fetch --quiet origin main
            git reset --hard origin/main

            # Sinds 21-09-2026 draait BookingBay in Docker: bouwen, migreren
            # en starten doet scripts/docker-deploy.sh (zie compose.yml).
            echo "==> Bouwen en starten in Docker"
            bash scripts/docker-deploy.sh
