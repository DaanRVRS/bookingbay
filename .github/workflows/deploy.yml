name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR=/var/www/bookingbay
            ENV_FILE=/etc/bookingbay/.env.production

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repo. Clone it first:"
              echo "  cd $APP_DIR && git clone https://github.com/DaanRVRS/bookingbay.git ."
              exit 1
            fi

            cd "$APP_DIR"

            echo "==> Pulling latest from origin/main"
            git fetch --quiet origin main
            git reset --hard origin/main

            echo "==> Symlinking production env"
            ln -sf "$ENV_FILE" "$APP_DIR/.env.production"

            echo "==> Loading env for build commands"
            set -a
            # shellcheck disable=SC1090
            . "$ENV_FILE"
            set +a

            echo "==> Installing dependencies"
            pnpm install --frozen-lockfile

            echo "==> Running database migrations"
            pnpm prisma migrate deploy

            echo "==> Generating Prisma client"
            pnpm prisma generate

            echo "==> Building Next.js app"
            pnpm build

            echo "==> Reloading pm2"
            # Force a clean (re)start to pick up ecosystem.config.cjs changes
            pm2 delete bookingbay > /dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save

            echo "==> Health check (retry up to 30s)"
            for i in $(seq 1 15); do
              sleep 2
              if curl --fail --silent --show-error \
                  -H "Host: www.bookingbay.nl" \
                  http://localhost/api/health > /tmp/health.json; then
                echo "OK on attempt $i:"
                cat /tmp/health.json
                echo ""
                echo "==> Deploy complete"
                exit 0
              fi
              echo "  attempt $i failed, retrying..."
            done

            echo "ERROR: health check did not succeed within 30s"
            pm2 logs bookingbay --lines 30 --nostream
            exit 1
